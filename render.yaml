# Render Blueprint — Noori backend (NestJS + Prisma + PostgreSQL)
#
# This deploys ONLY the backend API. Connect this repository in the Render
# dashboard (New -> Blueprint -> select this repo/branch) and Render will:
#   1. provision the managed Postgres database below,
#   2. build the backend (install deps, generate Prisma client, compile),
#   3. run migrations and start the server, exposing /api/healthz.
#
# To also deploy the web frontend later, uncomment the `noori-web` service
# block at the bottom and push again.

services:
  - type: web
    name: noori-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install && npx prisma generate && npm run build
    startCommand: cd backend && npx prisma migrate deploy && node dist/src/main
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Wired automatically to the managed Postgres database defined below.
      - key: DATABASE_URL
        fromDatabase:
          name: noori-db
          property: connectionString
      # Render generates a secure random secret on first deploy.
      - key: JWT_SECRET
        generateValue: true
      # Comma-separated list of allowed browser origins. Leave empty for now;
      # the app only allows local-dev origins + the origins listed here.
      # Set this to your frontend URL(s), e.g. https://app.example.com
      - key: CORS_ORIGIN
        value: ""
      # Push/SMS providers are disabled until you supply credentials.
      - key: PUSH_PROVIDER
        value: "none"
      - key: SMS_PROVIDER
        value: "none"

databases:
  - name: noori-db
    databaseName: noori
    plan: free
    postgresMajorVersion: "16"

